<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#c9e8f7"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7c59"/>
      <stop offset="100%" stop-color="#3a6349"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="400" fill="url(#sky)"/>
  <!-- Grass -->
  <rect y="300" width="600" height="100" fill="url(#grass)"/>
  <!-- Chapel body -->
  <rect x="150" y="180" width="300" height="120" fill="#f5f0e8" stroke="#8b7d6b" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="130,180 300,100 470,180" fill="#6b4226" stroke="#5a3520" stroke-width="2"/>
  <!-- Steeple base -->
  <rect x="275" y="60" width="50" height="40" fill="#f5f0e8" stroke="#8b7d6b" stroke-width="1.5"/>
  <!-- Steeple -->
  <polygon points="275,60 300,20 325,60" fill="#6b4226" stroke="#5a3520" stroke-width="1.5"/>
  <!-- Spire -->
  <line x1="300" y1="20" x2="300" y2="8" stroke="#c4a035" stroke-width="2"/>
  <circle cx="300" cy="6" r="3" fill="#c4a035"/>
  <!-- Door -->
  <rect x="275" y="240" width="50" height="60" rx="25" fill="#4a3728"/>
  <!-- Windows -->
  <rect x="190" y="210" width="30" height="50" rx="15" fill="#a8c8e8" stroke="#8b7d6b" stroke-width="1"/>
  <rect x="380" y="210" width="30" height="50" rx="15" fill="#a8c8e8" stroke="#8b7d6b" stroke-width="1"/>
  <!-- Round window -->
  <circle cx="300" cy="145" r="18" fill="#a8c8e8" stroke="#8b7d6b" stroke-width="1.5"/>
  <line x1="300" y1="127" x2="300" y2="163" stroke="#8b7d6b" stroke-width="1"/>
  <line x1="282" y1="145" x2="318" y2="145" stroke="#8b7d6b" stroke-width="1"/>
  <!-- Path -->
  <polygon points="275,300 325,300 340,400 260,400" fill="#d4c5a9"/>
  <!-- Trees -->
  <circle cx="100" cy="260" r="35" fill="#2d5a3f"/>
  <rect x="96" y="270" width="8" height="30" fill="#5a3520"/>
  <circle cx="500" cy="260" r="35" fill="#2d5a3f"/>
  <rect x="496" y="270" width="8" height="30" fill="#5a3520"/>
  <!-- Clouds -->
  <ellipse cx="120" cy="60" rx="50" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="480" cy="45" rx="60" ry="22" fill="white" opacity="0.7"/>
</svg>
